<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sorot</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <mask id="cut">
              <rect width="32" height="32" fill="#fff" />
              <rect x="15.1" width="1.8" height="32" fill="#000" />
              <rect y="15.1" width="32" height="1.8" fill="#000" />
            </mask>
          </defs>
          <circle cx="16" cy="16" r="16" fill="#0b0f1a" mask="url(#cut)" />
        </svg>
        <h1>Sorot</h1>
      </header>

      <label class="row" for="enabled">
        <span>
          <strong>Show odds chips on x.com</strong>
          <small id="enabled-hint">Chips appear under tweets that match a Panta market.</small>
        </span>
        <input id="enabled" type="checkbox" role="switch" aria-describedby="enabled-hint" />
      </label>

      <p id="mode" class="mode"></p>

      <a id="positions" class="link" href="#">View positions</a>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
